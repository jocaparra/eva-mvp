<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { width: 100%; max-width: 380px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.logo-box { width: 36px; height: 36px; background: #111; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 700; }
.logo-text { font-size: 18px; font-weight: 700; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.5; }
label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
input { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-family: inherit; font-size: 14px; color: #111; outline: none; transition: border-color 0.15s; }
input:focus { border-color: #111; }
input::placeholder { color: #bbb; }
button { width: 100%; margin-top: 14px; padding: 12px; background: #111; color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
button:hover:not(:disabled) { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.msg { margin-top: 14px; padding: 11px 14px; border-radius: 8px; font-size: 13px; display: none; }
.msg.error { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; display: block; }
.footer { margin-top: 32px; font-size: 12px; color: #bbb; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-box">EV</div>
    <span class="logo-text">EVA</span>
  </div>
  <h1>Entrar na plataforma</h1>
  <p>Digite seu número do WhatsApp cadastrado.</p>
  <label>Número do WhatsApp</label>
  <input type="tel" id="phone" placeholder="5511999999999" autocomplete="tel">
  <button id="btn" onclick="login()">Entrar</button>
  <div class="msg" id="msg"></div>
  <div class="footer">EVA by OX Ai · oxai.online</div>
</div>
<script>
const API = window.location.origin;

if (localStorage.getItem('eva_token')) window.location.href = '/platform';

async function login() {
  const phone = document.getElementById('phone').value.replace(/\D/g, '').trim();
  if (phone.length < 10) { showMsg('Digite um número válido com DDD (ex: 5511999999999)'); return; }

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const res = await fetch(`${API}/auth/dev-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Erro ao entrar');
    }
    const data = await res.json();
    localStorage.setItem('eva_token', data.access_token);
    localStorage.setItem('eva_phone', data.phone);
    window.location.href = '/platform';
  } catch(e) {
    showMsg(e.message);
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function showMsg(text) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg error';
}

document.getElementById('phone').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
