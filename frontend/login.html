<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { width: 100%; max-width: 380px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.logo-box { width: 36px; height: 36px; background: #111; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 700; }
.logo-text { font-size: 18px; font-weight: 700; color: #111; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.5; }
label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
input[type="email"] { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-family: inherit; font-size: 14px; color: #111; outline: none; transition: border-color 0.15s; }
input[type="email"]:focus { border-color: #111; }
input[type="email"]::placeholder { color: #bbb; }
button { width: 100%; margin-top: 14px; padding: 12px; background: #111; color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 13px; display: none; }
.msg.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: block; }
.msg.error { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; display: block; }
.footer { margin-top: 32px; font-size: 12px; color: #bbb; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-box">EV</div>
    <span class="logo-text">EVA</span>
  </div>
  <h1>Entrar na plataforma</h1>
  <p>Digite seu e-mail e enviaremos um link de acesso instantâneo.</p>
  <label for="email">E-mail</label>
  <input type="email" id="email" placeholder="voce@firma.com.br" autocomplete="email">
  <button id="btn" onclick="sendLink()">Enviar link de acesso</button>
  <div class="msg" id="msg"></div>
  <div class="footer">EVA by OX Ai · oxai.online</div>
</div>
<script>
const SUPABASE_URL = "COLE_SEU_SUPABASE_URL_AQUI";
const SUPABASE_ANON = "COLE_SUA_ANON_KEY_AQUI";

async function sendLink() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  if (!email) { showMsg('Digite seu e-mail.', 'error'); return; }
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
      body: JSON.stringify({ email, options: { emailRedirectTo: `${window.location.origin}/platform.html` } })
    });
    if (!res.ok) throw new Error();
    showMsg('✅ Link enviado! Verifique seu e-mail.', 'success');
  } catch {
    showMsg('Erro ao enviar. Tente novamente.', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Enviar link de acesso';
}
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = `msg ${type}`;
}
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') sendLink(); });
</script>
</body>
</html>
