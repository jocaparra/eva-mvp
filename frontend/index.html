<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVA — CIM Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: #1e1e1e;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.12);
      --error: #ff4d4d;
      --error-dim: rgba(255, 77, 77, 0.1);
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      line-height: 1.5;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--accent-dim);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder { color: #444; }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .btn {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:active:not(:disabled) { transform: scale(0.985); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      margin-top: 0.75rem;
    }

    .btn-outline:hover:not(:disabled) { background: var(--accent-dim); opacity: 1; }

    .status-panel {
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      display: none;
    }

    .status-panel.visible { display: block; }

    .loader-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text { font-size: 0.9rem; }
    .status-label { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.15rem; }

    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .status-badge.error {
      background: var(--error-dim);
      color: var(--error);
    }

    .status-badge.done {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .steps {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: var(--muted);
      transition: color 0.3s;
    }

    .step.active { color: var(--text); }
    .step.done { color: var(--accent); }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .step.active .step-dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .step.done .step-dot { background: var(--accent); }

    .error-box {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      background: var(--error-dim);
      border: 1px solid rgba(255, 77, 77, 0.25);
      border-radius: 10px;
      color: var(--error);
      font-size: 0.85rem;
      display: none;
    }

    .error-box.visible { display: block; }

    .success-box {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      background: var(--accent-dim);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 10px;
      color: var(--accent);
      font-size: 0.85rem;
      display: none;
    }

    .success-box.visible { display: block; }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">EVA</div>
        <h1>EVA</h1>
      </div>
      <p>CIM · Valuation · Due Diligence — geração automatizada</p>
    </header>

    <div class="card">
      <label for="company">Empresa ou comando</label>
      <input
        type="text"
        id="company"
        placeholder="Ex: Gerar CIM da Nubank, Fazer valuation da Apple..."
        autocomplete="off"
      />

      <button class="btn" id="submitBtn">Gerar documento</button>

      <div class="status-panel" id="statusPanel">
        <div class="loader-wrap" id="loaderWrap">
          <div class="spinner" id="spinner"></div>
          <div>
            <div class="status-label">Status do job</div>
            <div class="status-text">
              <span class="status-badge" id="statusBadge">pending</span>
            </div>
          </div>
        </div>

        <div class="steps" id="steps">
          <div class="step" data-step="pending"><span class="step-dot"></span>Pesquisa</div>
          <div class="step" data-step="running"><span class="step-dot"></span>Análise financeira</div>
          <div class="step" data-step="running"><span class="step-dot"></span>Geração do documento</div>
          <div class="step" data-step="done"><span class="step-dot"></span>Validação QA</div>
        </div>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox">Documento gerado com sucesso. Pronto para download.</div>

        <a class="btn btn-outline" id="downloadBtn" href="#" style="display:none; text-align:center; text-decoration:none;">
          ↓ Baixar documento (.pptx)
        </a>
      </div>
    </div>

    <footer>EVA MVP · Powered by LangGraph + Gemini + Tavily</footer>
  </div>

  <script>
    const API = window.location.origin;
    const POLL_INTERVAL = 2000;

    const companyInput = document.getElementById("company");
    const submitBtn = document.getElementById("submitBtn");
    const statusPanel = document.getElementById("statusPanel");
    const statusBadge = document.getElementById("statusBadge");
    const spinner = document.getElementById("spinner");
    const loaderWrap = document.getElementById("loaderWrap");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    const downloadBtn = document.getElementById("downloadBtn");
    const steps = document.querySelectorAll(".step");

    let pollTimer = null;

    function setStatus(status) {
      statusBadge.textContent = status;
      statusBadge.className = "status-badge";
      if (status === "error") statusBadge.classList.add("error");
      if (status === "done") statusBadge.classList.add("done");

      steps.forEach((step, i) => {
        step.classList.remove("active", "done");
        if (status === "pending" && i === 0) step.classList.add("active");
        if (status === "running") {
          if (i < 2) step.classList.add("done");
          else if (i === 2) step.classList.add("active");
        }
        if (status === "done") step.classList.add("done");
      });
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("visible");
      successBox.classList.remove("visible");
    }

    function hideError() {
      errorBox.classList.remove("visible");
    }

    function resetUI() {
      hideError();
      successBox.classList.remove("visible");
      downloadBtn.style.display = "none";
      spinner.style.display = "block";
      loaderWrap.style.display = "flex";
      submitBtn.disabled = true;
      companyInput.disabled = true;
    }

    function finishUI() {
      submitBtn.disabled = false;
      companyInput.disabled = false;
    }

    async function pollStatus(jobId) {
      try {
        const res = await fetch(`${API}/jobs/${jobId}/status`);
        if (!res.ok) throw new Error(`Erro ao consultar status (${res.status})`);

        const data = await res.json();
        setStatus(data.status);

        if (data.status === "done") {
          clearInterval(pollTimer);
          spinner.style.display = "none";
          const type = data.document_type || "CIM";
          successBox.textContent = `${type} gerado com sucesso. Pronto para download.`;
          successBox.classList.add("visible");
          downloadBtn.href = `${API}/jobs/${jobId}/download`;
          downloadBtn.style.display = "block";
          finishUI();
        } else if (data.status === "error") {
          clearInterval(pollTimer);
          spinner.style.display = "none";
          showError(data.error || "Ocorreu um erro durante a geração do CIM.");
          finishUI();
        }
      } catch (err) {
        clearInterval(pollTimer);
        spinner.style.display = "none";
        showError(err.message);
        finishUI();
      }
    }

    submitBtn.addEventListener("click", async () => {
      const company = companyInput.value.trim();
      if (!company) {
        showError("Informe o nome da empresa.");
        statusPanel.classList.add("visible");
        return;
      }

      if (pollTimer) clearInterval(pollTimer);

      statusPanel.classList.add("visible");
      resetUI();
      setStatus("pending");

      try {
        const res = await fetch(`${API}/jobs`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ company_name: company }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Erro ao criar job (${res.status})`);
        }

        const data = await res.json();
        setStatus(data.status);
        if (data.confirmation_message) {
          successBox.textContent = data.confirmation_message;
          successBox.classList.add("visible");
        }
        pollTimer = setInterval(() => pollStatus(data.id), POLL_INTERVAL);
        pollStatus(data.id);
      } catch (err) {
        spinner.style.display = "none";
        showError(err.message);
        finishUI();
      }
    });

    companyInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitBtn.click();
    });
  </script>
</body>
</html>
