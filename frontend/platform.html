<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA — Plataforma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; display: flex; height: 100vh; overflow: hidden; color: #111; }

/* SIDEBAR */
.sidebar { width: 52px; background: #111; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; flex-shrink: 0; }
.s-logo { width: 30px; height: 30px; background: white; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #111; margin-bottom: 12px; }
.s-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 16px; transition: all 0.15s; }
.s-icon:hover, .s-icon.active { background: #222; color: #fff; }
.s-spacer { flex: 1; }
.s-avatar { width: 30px; height: 30px; border-radius: 50%; background: #4A6CF7; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; cursor: pointer; }

/* LEFT PANEL */
.left { width: 300px; border-right: 1px solid #f0f0f0; display: flex; flex-direction: column; flex-shrink: 0; }
.left-header { padding: 16px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
.left-header h2 { font-size: 14px; font-weight: 600; }
.new-btn { padding: 5px 10px; background: #111; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.new-btn:hover { opacity: 0.8; }
.deal-list { flex: 1; overflow-y: auto; }
.deal-item { padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.1s; }
.deal-item:hover { background: #fafafa; }
.deal-item.active { background: #f5f7ff; border-left-color: #4A6CF7; }
.deal-title { font-size: 13px; font-weight: 500; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deal-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.deal-time { font-size: 11px; color: #aaa; }
.tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; }
.tag-cim { background: #EEF2FF; color: #4A6CF7; }
.tag-val { background: #FFF7ED; color: #EA580C; }
.tag-dd { background: #F5F5F5; color: #666; }
.tag-ok { background: #F0FDF4; color: #16A34A; }
.tag-proc { background: #FFF7ED; color: #EA580C; }
.empty-state { padding: 40px 20px; text-align: center; color: #bbb; font-size: 13px; }

/* MAIN AREA */
.main { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #f0f0f0; min-width: 0; }
.main-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
.main-header-left h3 { font-size: 14px; font-weight: 600; }
.main-header-left .tags { display: flex; gap: 6px; margin-top: 4px; }
.main-header-right { display: flex; gap: 8px; }
.btn-sm { padding: 6px 12px; border-radius: 6px; border: 1px solid #e8e8e8; background: white; font-size: 12px; font-weight: 500; cursor: pointer; color: #333; }
.btn-sm:hover { background: #f5f5f5; }
.btn-dark { background: #111; color: white; border-color: #111; }
.btn-dark:hover { opacity: 0.8; background: #111; }

/* INPUT AREA */
.input-area { padding: 16px 20px; border-top: 1px solid #f0f0f0; }
.input-wrap { display: flex; align-items: center; gap: 10px; background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 10px; padding: 10px 14px; }
.input-wrap input { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #111; outline: none; }
.input-wrap input::placeholder { color: #bbb; }
.model-tag { font-size: 10px; color: #aaa; background: #f0f0f0; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.send-btn { width: 30px; height: 30px; background: #111; border: none; border-radius: 7px; color: white; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.send-btn:hover { opacity: 0.8; }
.privacy-note { font-size: 11px; color: #ccc; text-align: center; margin-top: 8px; }

/* MESSAGES */
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; flex-direction: column; gap: 3px; }
.msg-user { align-items: flex-end; }
.msg-eva { align-items: flex-start; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.55; }
.msg-user .bubble { background: #111; color: white; border-radius: 12px 12px 2px 12px; }
.msg-eva .bubble { background: #f5f5f5; color: #111; border-radius: 12px 12px 12px 2px; }
.msg-time { font-size: 10px; color: #ccc; padding: 0 4px; }

/* TASKS */
.tasks-card { background: white; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 14px; max-width: 85%; }
.tasks-label { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.task-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; color: #333; }
.task-dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; }
.t-done { background: #16A34A; color: white; }
.t-run { background: #4A6CF7; color: white; animation: pulse 1s infinite; }
.t-wait { background: #e8e8e8; color: #aaa; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.task-tokens { margin-left: auto; font-size: 10px; color: #ccc; }

/* RIGHT PANEL */
.right { width: 420px; display: flex; flex-direction: column; flex-shrink: 0; }
.right-header { padding: 12px 18px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
.doc-info { display: flex; align-items: center; gap: 10px; }
.doc-icon { width: 28px; height: 28px; background: #EEF2FF; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.doc-name { font-size: 13px; font-weight: 600; }
.doc-sub { font-size: 11px; color: #aaa; }
.right-actions { display: flex; gap: 6px; }
.doc-body { flex: 1; overflow-y: auto; padding: 24px 28px; }
.doc-h1 { font-size: 15px; font-weight: 700; margin-bottom: 8px; margin-top: 20px; }
.doc-h1:first-child { margin-top: 0; }
.doc-p { font-size: 12px; color: #444; line-height: 1.7; margin-bottom: 10px; }
.doc-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 11px; }
.doc-table th { background: #f5f5f5; padding: 7px 10px; text-align: left; font-weight: 600; color: #333; border: 1px solid #e8e8e8; }
.doc-table td { padding: 6px 10px; border: 1px solid #e8e8e8; color: #444; }
.right-footer { padding: 10px 18px; border-top: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
.right-footer span { font-size: 11px; color: #ccc; }
.page-nav { display: flex; align-items: center; gap: 6px; }
.page-btn { width: 26px; height: 26px; border: 1px solid #e8e8e8; border-radius: 5px; background: white; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.page-btn.active { background: #111; color: white; border-color: #111; }

/* EMPTY STATE */
.empty-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; gap: 8px; }
.empty-main .icon { font-size: 36px; margin-bottom: 4px; }
.empty-main p { font-size: 13px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="s-logo">EV</div>
  <div class="s-icon active" title="Deals">📄</div>
  <div class="s-icon" title="Buscar">🔍</div>
  <div class="s-icon" title="Arquivos">📁</div>
  <div class="s-spacer"></div>
  <div class="s-icon" title="Configurações">⚙️</div>
  <div class="s-avatar" id="avatar" title="Sair" onclick="logout()">JO</div>
</div>

<!-- LEFT PANEL -->
<div class="left">
  <div class="left-header">
    <h2>Deals</h2>
    <button class="new-btn" onclick="showNewDeal()">+ Novo</button>
  </div>
  <div class="deal-list" id="dealList">
    <div class="empty-state">Nenhum deal ainda.<br>Peça um documento no chat.</div>
  </div>
</div>

<!-- MAIN AREA -->
<div class="main" id="mainArea">
  <div class="empty-main" id="emptyMain">
    <div class="icon">💬</div>
    <p>Selecione um deal ou peça um novo documento</p>
  </div>

  <div id="chatArea" style="display:none; flex:1; display:none; flex-direction:column;">
    <div class="main-header" id="chatHeader">
      <div class="main-header-left">
        <h3 id="chatTitle">—</h3>
        <div class="tags" id="chatTags"></div>
      </div>
      <div class="main-header-right">
        <button class="btn-sm" id="downloadBtn" onclick="downloadDoc()" style="display:none">⬇ Baixar</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-wrap">
        <input type="text" id="msgInput" placeholder="Peça um CIM, Valuation ou Due Diligence...">
        <span class="model-tag">EVA</span>
        <button class="send-btn" onclick="sendMsg()">↑</button>
      </div>
      <div class="privacy-note">EVA nunca usa seus dados para treinar modelos.</div>
    </div>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="right" id="rightPanel" style="display:none">
  <div class="right-header">
    <div class="doc-info">
      <div class="doc-icon">📄</div>
      <div>
        <div class="doc-name" id="docName">—</div>
        <div class="doc-sub" id="docSub">Documento pronto</div>
      </div>
    </div>
    <div class="right-actions">
      <a class="btn-sm btn-dark" id="docDownloadLink" href="#" target="_blank">⬇ Download</a>
    </div>
  </div>

  <div class="doc-body" id="docBody">
    <div class="doc-h1">Documento carregando...</div>
  </div>

  <div class="right-footer">
    <span>EVA · oxai.online · Confidencial</span>
    <div class="page-nav">
      <button class="page-btn">‹</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">›</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const API = window.location.origin;
const SUPABASE_URL = "COLE_SEU_SUPABASE_URL_AQUI";
const SUPABASE_ANON = "COLE_SUA_ANON_KEY_AQUI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;
let currentPhone = null;
let pollTimer = null;

// Verifica sessão ao carregar
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = '/login';
    return;
  }
  currentUser = session.user;

  // Busca phone vinculado ao email no Supabase
  const res = await fetch(`${API}/me`, {
    headers: { 'Authorization': `Bearer ${session.access_token}` }
  });
  if (res.ok) {
    const data = await res.json();
    currentPhone = data.phone;
    document.getElementById('avatar').textContent = currentUser.email.substring(0,2).toUpperCase();
  }

  loadDeals(session.access_token);
}

function logout() {
  sb.auth.signOut().then(() => window.location.href = '/login');
}

async function loadDeals(token) {
  if (!token) {
    const { data: { session } } = await sb.auth.getSession();
    token = session?.access_token;
  }
  if (!token) return;
  try {
    const res = await fetch(`${API}/deals`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401) { window.location.href = '/login'; return; }
    if (!res.ok) return;
    const deals = await res.json();
    renderDealList(deals, token);
  } catch(e) { console.error(e); }
}

function renderDealList(deals, token) {
  const list = document.getElementById('dealList');
  if (!deals.length) {
    list.innerHTML = '<div class="empty-state">Nenhum deal ainda.<br>Clique em + Novo para começar.</div>';
    return;
  }
  const typeTag = { CIM: 'tag-cim', VALUATION: 'tag-val', DUE_DILIGENCE: 'tag-dd' };
  const typeLabel = { CIM: 'CIM', VALUATION: 'Valuation', DUE_DILIGENCE: 'Due Diligence' };
  list.innerHTML = deals.map(d => `
    <div class="deal-item" onclick="selectDeal('${d.id}', '${d.nome}', '${d.document_type || 'CIM'}')">
      <div class="deal-title">${d.nome}</div>
      <div class="deal-meta">
        <span class="deal-time">${formatDate(d.criado_em)}</span>
        <span class="tag ${typeTag[d.document_type] || 'tag-dd'}">${typeLabel[d.document_type] || d.document_type}</span>
        ${d.documentos && d.documentos.length ? '<span class="tag tag-ok">Pronto</span>' : '<span class="tag tag-proc">Processando</span>'}
      </div>
    </div>
  `).join('');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'short'});
}

async function getToken() {
  const { data: { session } } = await sb.auth.getSession();
  return session?.access_token;
}

async function selectDeal(dealId, nome, type) {
  const token = await getToken();
  document.querySelectorAll('.deal-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');

  const typeLabel = { CIM: 'CIM', VALUATION: 'Valuation', DUE_DILIGENCE: 'Due Diligence' };
  const typeTag = { CIM: 'tag-cim', VALUATION: 'tag-val', DUE_DILIGENCE: 'tag-dd' };

  document.getElementById('emptyMain').style.display = 'none';
  const chatArea = document.getElementById('chatArea');
  chatArea.style.display = 'flex';
  chatArea.style.flexDirection = 'column';
  chatArea.style.flex = '1';

  document.getElementById('chatTitle').textContent = `${typeLabel[type] || type} — ${nome}`;
  document.getElementById('chatTags').innerHTML = `
    <span class="tag ${typeTag[type] || 'tag-dd'}">${typeLabel[type] || type}</span>
  `;

  try {
    const res = await fetch(`${API}/deal/${dealId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    if (data.documentos && data.documentos.length) {
      showDocument(data.documentos[0], dealId, nome, type);
    }
  } catch(e) { console.error(e); }
}

function showDocument(doc, dealId, nome, type) {
  document.getElementById('rightPanel').style.display = 'flex';
  document.getElementById('rightPanel').style.flexDirection = 'column';
  document.getElementById('docName').textContent = `${nome}.pptx`;
  const downloadUrl = `${API}/deal/${dealId}/download/${doc.id}`;
  document.getElementById('docDownloadLink').href = downloadUrl;
  document.getElementById('downloadBtn').style.display = 'block';
  document.getElementById('docBody').innerHTML = `
    <div class="doc-h1">Documento gerado por EVA</div>
    <div class="doc-p">O documento <strong>${nome}</strong> foi gerado com sucesso. Clique em Download para abrir o arquivo completo.</div>
    <div class="doc-p">Tipo: <strong>${type}</strong><br>Gerado em: <strong>${formatDate(doc.criado_em)}</strong></div>
    <div class="doc-h1">Acesso seguro</div>
    <div class="doc-p">Armazenado em ambiente isolado para sua firma. Link de download expira em 1 hora.</div>
  `;
}

function showNewDeal() {
  document.getElementById('emptyMain').style.display = 'none';
  const chatArea = document.getElementById('chatArea');
  chatArea.style.display = 'flex';
  chatArea.style.flexDirection = 'column';
  chatArea.style.flex = '1';
  document.getElementById('chatTitle').textContent = 'Novo documento';
  document.getElementById('chatTags').innerHTML = '';
  document.getElementById('messages').innerHTML = `
    <div class="msg msg-eva">
      <div class="bubble">Olá! Sou a EVA. Me diga qual documento quer gerar.<br><br>Exemplos:<br>• <em>CIM da Nubank</em><br>• <em>Valuation da Apple</em><br>• <em>Due diligence da Loggi</em></div>
      <div class="msg-time">agora</div>
    </div>
  `;
  document.getElementById('rightPanel').style.display = 'none';
  document.getElementById('msgInput').focus();
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const token = await getToken();

  addMessage(text, 'user');
  addMessage('Processando seu pedido...', 'eva');

  try {
    const res = await fetch(`${API}/jobs/web`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Erro ao criar job');
    }
    const job = await res.json();
    updateLastMessage(`⏳ Gerando *${job.company_name}*... Aguarde 2-5 minutos.`);
    showTasksCard(job.id);
    pollJob(job.id, job.company_name, job.document_type, token);
    loadDeals(token);
  } catch(e) {
    updateLastMessage(`❌ ${e.message}`);
  }
}

function addMessage(text, type) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg msg-${type}`;
  div.innerHTML = `<div class="bubble">${text}</div><div class="msg-time">${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function updateLastMessage(text) {
  const msgs = document.getElementById('messages');
  const items = msgs.querySelectorAll('.msg-eva');
  const last = items[items.length - 1]?.querySelector('.bubble');
  if (last) last.textContent = text;
}

function showTasksCard(jobId) {
  const msgs = document.getElementById('messages');
  const card = document.createElement('div');
  card.className = 'msg msg-eva';
  card.id = `tasks-${jobId}`;
  card.innerHTML = `
    <div class="tasks-card">
      <div class="tasks-label">Progresso</div>
      <div class="task-row"><div class="task-dot t-run" id="t1-${jobId}">▶</div><span>Pesquisa de dados</span></div>
      <div class="task-row"><div class="task-dot t-wait" id="t2-${jobId}">○</div><span>Análise financeira</span></div>
      <div class="task-row"><div class="task-dot t-wait" id="t3-${jobId}">○</div><span>Geração do documento</span></div>
      <div class="task-row"><div class="task-dot t-wait" id="t4-${jobId}">○</div><span>Validação QA</span></div>
    </div>
    <div class="msg-time">${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
  `;
  msgs.appendChild(card);
  msgs.scrollTop = msgs.scrollHeight;
}

function pollJob(jobId, companyName, docType, token) {
  if (pollTimer) clearInterval(pollTimer);
  let step = 1;
  pollTimer = setInterval(async () => {
    try {
      step = Math.min(step + 1, 4);
      for (let i = 1; i < step; i++) {
        const dot = document.getElementById(`t${i}-${jobId}`);
        if (dot) { dot.className = 'task-dot t-done'; dot.textContent = '✓'; }
      }
      const dot = document.getElementById(`t${step}-${jobId}`);
      if (dot && !dot.classList.contains('t-done')) { dot.className = 'task-dot t-run'; dot.textContent = '▶'; }

      const res = await fetch(`${API}/jobs/${jobId}/status`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) return;
      const job = await res.json();

      if (job.status === 'done') {
        clearInterval(pollTimer);
        for (let i = 1; i <= 4; i++) {
          const d = document.getElementById(`t${i}-${jobId}`);
          if (d) { d.className = 'task-dot t-done'; d.textContent = '✓'; }
        }
        addMessage(`✅ *${companyName}* está pronto! Aparecerá na lista em instantes.`, 'eva');
        setTimeout(() => loadDeals(token), 2000);
      }
      if (job.status === 'error') {
        clearInterval(pollTimer);
        addMessage(`❌ Erro: ${job.error || 'tente novamente.'}`, 'eva');
      }
    } catch(e) { console.error(e); }
  }, 4000);
}

document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

// Inicia
init();
</script>
</body>
</html>
